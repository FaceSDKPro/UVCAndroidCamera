pluginManagement {
    resolutionStrategy { eachPlugin {
        if (requested.id.id.startsWith('com.android.')) useModule("com.android.tools.build:gradle:${requested.version}")
    } }
    repositories {
        if (providers.gradleProperty('googleMavenMirror').isPresent()) maven { url providers.gradleProperty('googleMavenMirror').get() }
        google(); mavenCentral(); gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (providers.gradleProperty('uvcSdkRepository').isPresent()) {
            maven { url = uri(file(providers.gradleProperty('uvcSdkRepository').get())) }
        }
        google(); mavenCentral()
    }
}
rootProject.name = 'UVCAndroidCamera'
include ':sample'
if (!providers.gradleProperty('uvcSdkRepository').isPresent()) include ':UVCCamera'

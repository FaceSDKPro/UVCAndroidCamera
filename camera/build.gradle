plugins { id 'com.android.library'; id 'maven-publish' }
android {
    namespace 'com.serenegiant.uvccamera'
    compileSdk 36
    ndkVersion '27.0.12077973'
    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildFeatures { buildConfig true }
    externalNativeBuild { ndkBuild { path file('src/main/jni/Android.mk') } }
    publishing { singleVariant('release') { withSourcesJar() } }
}
afterEvaluate { publishing { publications { release(MavenPublication) {
    from components.release
    groupId = 'com.facesdkpro'
    artifactId = 'uvc-android-camera'
    version = '0.1.0'
    pom { name = 'UVCAndroidCamera'; description = 'UVC preview, frame acquisition and device control'; url = 'https://github.com/FaceSDKPro/UVCAndroidCamera' }
} } } }

dependencies { testImplementation 'junit:junit:4.13.2' }

plugins { id 'com.android.library'; id 'maven-publish' }
android {
    namespace 'com.serenegiant.uvccamera'
    compileSdk 36
    ndkVersion rootProject.ext.uvcNative.ndkVersion
    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters.addAll(rootProject.ext.uvcNative.abis) }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildFeatures { buildConfig true }
    externalNativeBuild { ndkBuild { path file('src/main/jni/Android.mk') } }
    publishing { singleVariant('release') { withSourcesJar() } }
}
afterEvaluate { publishing { publications { release(MavenPublication) {
    from components.release
    groupId = 'com.facesdkpro'
    artifactId = 'uvc-android-camera'
    version = rootProject.ext.uvcSdkVersion
    pom {
        name = 'UVCAndroidCamera'
        description = 'Independent RGB/IR UVC camera SDK: preview, bounded NV21/GRAY8 pairs, controls and lifecycle'
        url = 'https://github.com/FaceSDKPro/UVCAndroidCamera'
        licenses { license {
            name = 'Apache License, Version 2.0; bundled native components retain their own licenses (see NOTICE)'
            url = 'https://github.com/FaceSDKPro/UVCAndroidCamera/blob/main/NOTICE'
            distribution = 'repo'
        } }
        scm { url = 'https://github.com/FaceSDKPro/UVCAndroidCamera'; connection = 'scm:git:https://github.com/FaceSDKPro/UVCAndroidCamera.git' }
    }
} }
repositories { maven { name = 'Sdk'; url = rootProject.layout.buildDirectory.dir('sdk-maven') } }
} }

dependencies { testImplementation 'junit:junit:4.13.2' }

// ndk-build does not report linker script inputs to AGP. Track them explicitly.
tasks.configureEach { task ->
    if (task.name.startsWith('buildNdkBuild')) {
        task.inputs.files(fileTree('src/main/jni/exports') { include '*.map' }).withPropertyName('nativeExportMaps')
    }
}
